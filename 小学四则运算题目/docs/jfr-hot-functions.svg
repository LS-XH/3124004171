<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">JFR 热点函数采样 CPU 时间估算</title>
  <desc id="desc">以十毫秒执行采样周期估算优化前后四个主要热点函数的独占 CPU 时间。</desc>
  <rect width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#172033">JFR 热点函数：采样 CPU 时间估算</text>
  <text x="500" y="65" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#5d6678">估算值 = 顶部栈采样数 × 10 ms；同一工作负载共预热 10 次、测量 30 次</text>

  <rect x="690" y="82" width="14" height="14" rx="2" fill="#5470c6"/>
  <text x="712" y="94" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#313848">优化前</text>
  <rect x="775" y="82" width="14" height="14" rx="2" fill="#ee7d31"/>
  <text x="797" y="94" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#313848">优化后</text>

  <g stroke="#dfe4ec" stroke-width="1">
    <line x1="300" y1="112" x2="300" y2="470"/>
    <line x1="400" y1="112" x2="400" y2="470"/>
    <line x1="500" y1="112" x2="500" y2="470"/>
    <line x1="600" y1="112" x2="600" y2="470"/>
    <line x1="700" y1="112" x2="700" y2="470"/>
    <line x1="800" y1="112" x2="800" y2="470"/>
    <line x1="900" y1="112" x2="900" y2="470"/>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7485" text-anchor="middle">
    <text x="300" y="490">0</text><text x="400" y="490">50</text><text x="500" y="490">100</text>
    <text x="600" y="490">150</text><text x="700" y="490">200</text><text x="800" y="490">250</text><text x="900" y="490">300 ms</text>
  </g>

  <g font-family="Consolas, Microsoft YaHei, monospace" font-size="14" fill="#263044" text-anchor="end">
    <text x="282" y="157">Fraction.&lt;init&gt;</text>
    <text x="282" y="247">Fraction.toDisplayString</text>
    <text x="282" y="337">Fraction.canonicalKey</text>
    <text x="282" y="427">writeGeneratedFiles</text>
  </g>

  <g>
    <rect x="300" y="132" width="620" height="24" rx="3" fill="#5470c6"/>
    <rect x="300" y="162" width="160" height="24" rx="3" fill="#ee7d31"/>
    <rect x="300" y="222" width="520" height="24" rx="3" fill="#5470c6"/>
    <rect x="300" y="252" width="360" height="24" rx="3" fill="#ee7d31"/>
    <rect x="300" y="312" width="280" height="24" rx="3" fill="#5470c6"/>
    <rect x="300" y="342" width="240" height="24" rx="3" fill="#ee7d31"/>
    <rect x="300" y="402" width="200" height="24" rx="3" fill="#5470c6"/>
    <rect x="300" y="432" width="300" height="24" rx="3" fill="#ee7d31"/>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">
    <text x="928" y="149" fill="#3f5ca7">310 ms（31 次）</text>
    <text x="468" y="179" fill="#c65d1d">80 ms（8 次）</text>
    <text x="828" y="239" fill="#3f5ca7">260 ms（26 次）</text>
    <text x="668" y="269" fill="#c65d1d">180 ms（18 次）</text>
    <text x="588" y="329" fill="#3f5ca7">140 ms（14 次）</text>
    <text x="548" y="359" fill="#c65d1d">120 ms（12 次）</text>
    <text x="508" y="419" fill="#3f5ca7">100 ms（10 次）</text>
    <text x="608" y="449" fill="#c65d1d">150 ms（15 次）</text>
  </g>

  <rect x="170" y="515" width="660" height="36" rx="8" fill="#f4f6fa"/>
  <text x="500" y="538" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#536075">说明：这是采样得到的独占 CPU 时间估算，不等于逐次调用的精确墙钟耗时。</text>
</svg>

